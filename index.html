<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reuters Sales Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,900;1,9..144,600&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #0A0A0C;
  --panel: #131316;
  --ink: #F3F1EC;
  --muted: #8C8B92;
  --line: rgba(255,255,255,0.14);
  --coral: #FF5A3C;
  --coral-soft: rgba(255,90,60,0.12);
  --yellow: #FFC93C;
  --mint: #7FE0CE;
  --serif: 'Fraunces', Georgia, serif;
  --sans: 'Space Grotesk', 'Segoe UI', Arial, sans-serif;
  --mono: 'IBM Plex Mono', monospace;
}
html { font-size: 15px; }
body {
  font-family: var(--sans); background: var(--bg); color: var(--ink);
  min-height: 100vh; display: flex; flex-direction: column;
}
.bg-glow {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(ellipse 55% 40% at 50% -5%, rgba(255,90,60,0.10), transparent 60%);
}
.topbar {
  position: relative; z-index: 1; padding: 22px 32px; display: flex; align-items: center;
}
.wordmark {
  font-family: var(--sans); font-weight: 700; font-size: 13px; letter-spacing: 0.12em; color: var(--ink);
}
.wordmark span { color: var(--muted); font-weight: 400; }

.stage { position: relative; z-index: 1; flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px 24px 60px; }
.wrap { width: 100%; max-width: 620px; }

/* ---- Questionnaire ---- */
.q-eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--coral); margin-bottom: 14px; }
.q-title { font-family: var(--serif); font-weight: 900; font-size: 34px; line-height: 1.15; margin-bottom: 10px; }
.q-sub { font-family: var(--sans); font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 34px; max-width: 480px; }
.field { margin-bottom: 24px; }
.field label {
  display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 10px;
}
.field input, .field textarea {
  width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
  font-family: var(--sans); font-size: 14px; color: var(--ink); outline: none; transition: border-color 0.15s;
}
.field input::placeholder, .field textarea::placeholder { color: #55545C; }
.field input:focus, .field textarea:focus { border-color: var(--coral); }
.field textarea { resize: vertical; min-height: 64px; }
.pill-grid { display: flex; flex-wrap: wrap; gap: 8px; max-height: 190px; overflow-y: auto; padding: 2px; }
.q-pill {
  padding: 8px 15px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel);
  font-family: var(--sans); font-size: 12.5px; font-weight: 500; color: var(--ink); cursor: pointer; transition: all 0.15s;
}
.q-pill:hover:not(.active) { border-color: #4a4a52; }
.q-pill.active { background: var(--coral); border-color: var(--coral); color: white; }
.q-actions { display: flex; align-items: center; justify-content: space-between; margin-top: 36px; }
.q-skip {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.05em; color: var(--muted);
  cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
}
.q-submit {
  font-family: var(--sans); font-size: 14px; font-weight: 700; padding: 13px 28px; border-radius: 999px;
  background: var(--coral); color: white; border: none; cursor: pointer; transition: all 0.15s;
}
.q-submit:hover { background: #FF6E52; transform: translateY(-1px); }

/* ---- Welcome ---- */
.w-eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--coral); margin-bottom: 14px; }
.w-title { font-family: var(--serif); font-weight: 900; font-size: 40px; line-height: 1.1; margin-bottom: 12px; }
.w-sub { font-family: var(--sans); font-size: 14.5px; color: var(--muted); line-height: 1.6; margin-bottom: 40px; max-width: 480px; }

.dest-grid { display: grid; gap: 14px; }
.dest-card {
  display: flex; align-items: center; justify-content: space-between; gap: 18px;
  padding: 22px 26px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel);
  text-decoration: none; color: var(--ink); transition: all 0.18s; cursor: pointer;
}
.dest-card:hover { border-color: #4a4a52; transform: translateY(-2px); }
.dest-card.primary {
  background: linear-gradient(135deg, rgba(255,90,60,0.14), rgba(255,90,60,0.04));
  border-color: rgba(255,90,60,0.4);
}
.dest-card.primary:hover { border-color: var(--coral); }
.dest-label { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.dest-card.primary .dest-label { color: var(--coral); }
.dest-title { font-family: var(--serif); font-weight: 700; font-size: 21px; margin-bottom: 4px; }
.dest-desc { font-family: var(--sans); font-size: 13px; color: var(--muted); }
.dest-arrow { font-family: var(--serif); font-style: italic; font-size: 22px; color: var(--muted); flex-shrink: 0; }
.dest-card.primary .dest-arrow { color: var(--coral); }

.w-footer { margin-top: 30px; text-align: center; }
.w-edit-link {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.05em; color: var(--muted);
  cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
}
</style>
</head>
<body>
<div class="bg-glow"></div>

<div class="topbar">
  <span class="wordmark">REUTERS<span>™ · SALES INTELLIGENCE</span></span>
</div>

<div class="stage">
  <div class="wrap" id="stage-content"></div>
</div>

<script>
const PROFILE_KEY = 'reuters_prospector_profile';
const REGION_OPTIONS = ['US','Europe','MENA','EMEA','APAC'];
const VERTICAL_OPTIONS = ['Alcohol','Apparel & Footwear','Automotive','Banking, Finance & Insurance','Beverages','Business & Professional Services','Consumer Electronics','Consumer Products','Content Agency','Cosmetics & Personal Care','Defence & Aerospace','Education','Energy & Utilities','Food','Government','Health & Medical','Home Appliances','Home Furnishings & Decoration','Industrial','Luxury','Media & Entertainment','Non-Profits & NGOs','Online Services & Apps','Petcare','Property','Retail','Sport','Technology','Telecoms & Connectivity','Tobacco, Smoking & Related Products','Toys & Gaming','Trade & Investment','Travel & Tourism'];

function getProfile() {
  try {
    const raw = localStorage.getItem(PROFILE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderQuestionnaire(existing) {
  const stage = document.getElementById('stage-content');
  stage.innerHTML = `
    <div class="q-eyebrow">Before we begin</div>
    <div class="q-title">Tell us who you are.</div>
    <div class="q-sub">This personalizes what you see across the tools — your regions, your verticals. Takes about 30 seconds, saved only on this device.</div>
    <div class="field"><label>Your name</label><input id="q-name" placeholder="e.g. Dana"></div>
    <div class="field"><label>Regions you cover</label><div class="pill-grid" id="q-regions"></div></div>
    <div class="field"><label>Verticals you focus on</label><div class="pill-grid" id="q-verticals"></div></div>
    <div class="q-actions">
      <span class="q-skip" onclick="skipToWelcome()">Skip for now</span>
      <button class="q-submit" onclick="submitQuestionnaire()">Enter →</button>
    </div>
  `;
  const regionsEl = document.getElementById('q-regions');
  REGION_OPTIONS.forEach(r => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'q-pill' + (existing && existing.regions && existing.regions.includes(r) ? ' active' : '');
    b.textContent = r;
    b.onclick = () => b.classList.toggle('active');
    regionsEl.appendChild(b);
  });
  const vertEl = document.getElementById('q-verticals');
  VERTICAL_OPTIONS.forEach(v => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'q-pill' + (existing && existing.verticals && existing.verticals.includes(v) ? ' active' : '');
    b.textContent = v;
    b.onclick = () => b.classList.toggle('active');
    vertEl.appendChild(b);
  });
  if (existing) {
    document.getElementById('q-name').value = existing.name || '';
  }
}

function submitQuestionnaire() {
  const regions = [...document.querySelectorAll('#q-regions .q-pill.active')].map(b => b.textContent);
  const verticals = [...document.querySelectorAll('#q-verticals .q-pill.active')].map(b => b.textContent);
  const name = document.getElementById('q-name').value.trim();
  localStorage.setItem(PROFILE_KEY, JSON.stringify({ name, regions, verticals }));
  renderWelcome();
}

function skipToWelcome() {
  renderWelcome();
}

function renderWelcome() {
  const profile = getProfile();
  const name = profile && profile.name ? profile.name : 'there';
  const stage = document.getElementById('stage-content');
  stage.innerHTML = `
    <div class="w-eyebrow">Ready when you are</div>
    <div class="w-title">Welcome, ${escapeHtml(name)}.</div>
    <div class="w-sub">Pick up where you left off, or start with what's most relevant to you today.</div>
    <div class="dest-grid">
      <a class="dest-card primary" href="insights.html">
        <div>
          <div class="dest-label">Start here</div>
          <div class="dest-title">My Insights</div>
          <div class="dest-desc">Your personalized picks — matched to your regions and verticals, cross-checked against the team's pipeline</div>
        </div>
        <div class="dest-arrow">→</div>
      </a>
      <a class="dest-card" href="brand-prospector.html">
        <div>
          <div class="dest-label">Explore</div>
          <div class="dest-title">Brand Prospector</div>
          <div class="dest-desc">The full competitive database — every brand, every publisher, every filter</div>
        </div>
        <div class="dest-arrow">→</div>
      </a>
      <a class="dest-card" href="prospects.html">
        <div>
          <div class="dest-label">Track</div>
          <div class="dest-title">Sales Prospects</div>
          <div class="dest-desc">The team's active pipeline — who's chasing what, and where things stand</div>
        </div>
        <div class="dest-arrow">→</div>
      </a>
    </div>
    <div class="w-footer"><span class="w-edit-link" onclick="renderQuestionnaire(getProfile())">Edit your profile</span></div>
  `;
}

const existingProfile = getProfile();
if (existingProfile) {
  renderWelcome();
} else {
  renderQuestionnaire(null);
}
</script>
</body>
</html>

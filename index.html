<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Prospects — Reuters</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,900;1,9..144,600&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #FBF7EF;
  --panel: #FFFFFF;
  --ink: #14151A;
  --ink-dim: #55575E;
  --line: #14151A;
  --coral: #FF4B33;
  --coral-soft: #FFE0D9;
  --yellow: #FFC93C;
  --teal: #2EC4B6;
  --teal-soft: #DBF6F3;
  --pink: #FF6FA5;
  --blue: #3D5AFE;
  --serif: 'Fraunces', Georgia, serif;
  --sans: 'Space Grotesk', 'Segoe UI', Arial, sans-serif;
  --mono: 'JetBrains Mono', 'IBM Plex Mono', monospace;
}
html { font-size: 15px; }
body { font-family: var(--sans); background: var(--bg); color: var(--ink); min-height: 100vh; }

/* HEADER */
.header {
  position: sticky; top: 0; z-index: 50;
  background: var(--bg); border-bottom: 3px solid var(--ink);
  padding: 14px 28px; display: flex; align-items: center; flex-wrap: wrap; gap: 14px;
}
.header-brand {
  font-weight: 700; font-size: 13px; letter-spacing: 0.1em;
  background: var(--ink); color: var(--bg); padding: 6px 10px; border-radius: 6px; transform: rotate(-1.5deg);
}
.header-title {
  font-family: var(--serif); font-weight: 900; font-size: 22px; color: var(--ink);
}
.header-nav a {
  font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--ink); text-decoration: none; padding: 6px 12px; border: 2px solid var(--ink); border-radius: 20px;
  transition: all 0.15s; display: inline-block;
}
.header-nav a:hover { background: var(--ink); color: var(--bg); transform: rotate(-1deg); }
.header-meta { margin-left: auto; display:flex; align-items:center; gap:10px; }
.edit-toggle {
  padding: 7px 14px; border-radius: 20px; background: var(--panel); border: 2px solid var(--ink);
  color: var(--ink); font-family: var(--mono); font-weight: 700; font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase;
  cursor: pointer; transition: all 0.15s;
}
.edit-toggle:hover { transform: rotate(-1.5deg); }
.edit-toggle.on { background: var(--coral); border-color: var(--ink); color: white; }

.dl-banner {
  background: var(--yellow); color: var(--ink); padding: 10px 28px; display: none;
  font-family: var(--mono); font-weight: 700; font-size: 11px; align-items: center; justify-content: space-between;
  border-bottom: 3px solid var(--ink);
}
body.dirty .dl-banner { display: flex; }

/* FILTER BAR */
.filter-bar {
  padding: 20px 28px; border-bottom: 3px solid var(--ink); background: var(--panel);
  display: flex; flex-wrap: wrap; align-items: center; gap: 20px;
}
.filter-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.filter-group-label {
  font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim);
}
.btn-group { display: flex; flex-wrap: wrap; gap: 7px; }
.filter-btn {
  padding: 7px 13px; border-radius: 20px; border: 2px solid var(--ink);
  background: var(--panel); font-family: var(--sans); font-size: 12.5px; font-weight: 600;
  color: var(--ink); cursor: pointer; transition: all 0.15s;
}
.filter-btn:hover:not(.active) { transform: rotate(-2deg) translateY(-1px); }
.filter-btn.active { background: var(--coral); border-color: var(--ink); color: white; transform: rotate(1deg); }
.search-wrap { position: relative; margin-left: auto; }
.search-wrap input {
  width: 220px; padding: 8px 14px 8px 32px; border-radius: 20px;
  background: var(--bg); border: 2px solid var(--ink); color: var(--ink);
  font-family: var(--sans); font-size: 13px; outline: none;
}
.search-wrap input:focus { box-shadow: 3px 3px 0 var(--ink); }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink); font-size: 13px; }
.reset-link {
  font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--ink); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px;
}

/* TOOLBAR */
.toolbar {
  padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.results-label { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.04em; color: var(--ink-dim); }
.results-label strong { color: var(--ink); font-weight: 700; }
.toolbar-actions { display: flex; gap: 10px; }
.btn {
  font-family: var(--sans); font-size: 13px; font-weight: 700;
  padding: 9px 18px; border-radius: 20px; background: var(--ink); color: var(--bg); border: 2px solid var(--ink);
  cursor: pointer; transition: all 0.15s;
}
.btn:hover { transform: rotate(-1deg) translateY(-1px); box-shadow: 3px 3px 0 var(--coral); }
.btn.ghost { background: var(--panel); color: var(--ink); }
.btn.ghost:hover { box-shadow: 3px 3px 0 var(--ink); }

/* BOARD */
.board { padding: 8px 28px 80px; display: grid; gap: 34px; }
.rep-section { display: grid; gap: 16px; }
.rep-heading { display: flex; align-items: center; gap: 12px; }
.rep-heading-name {
  font-family: var(--serif); font-weight: 900; font-size: 26px; color: var(--ink);
  background: var(--yellow); padding: 2px 12px; border-radius: 8px; transform: rotate(-1deg); display: inline-block;
}
.rep-heading-count {
  font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; color: var(--ink-dim);
}
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }

.card {
  background: var(--panel); border: 2.5px solid var(--ink); border-radius: 14px; padding: 18px 20px;
  display: flex; flex-direction: column; gap: 9px; position: relative;
  box-shadow: 5px 5px 0 var(--ink);
  transition: transform 0.15s, box-shadow 0.15s;
}
.card:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--coral); }
.card-lead-n {
  position: absolute; top: -12px; left: 16px; background: var(--ink); color: var(--bg);
  font-family: var(--mono); font-size: 9.5px; font-weight: 700; padding: 3px 8px; border-radius: 20px;
}
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-top: 4px; }
.card-brand { font-family: var(--serif); font-weight: 900; font-size: 19px; color: var(--ink); line-height: 1.2; }
.card-country {
  font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: 0.04em; color: var(--ink);
  background: var(--teal-soft); border: 1.5px solid var(--ink); padding: 3px 9px; border-radius: 999px; white-space: nowrap; flex-shrink: 0;
}
.card-about { font-family: var(--sans); font-size: 12.5px; color: var(--ink-dim); line-height: 1.5; }
.card-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: 2px; }
.card-pub {
  font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: 0.03em; color: var(--ink); text-transform: uppercase;
  background: var(--yellow); border: 1.5px solid var(--ink); padding: 3px 9px; border-radius: 999px;
}
.card-month {
  font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: 0.03em; color: var(--ink);
  background: var(--panel); border: 1.5px solid var(--ink); padding: 3px 9px; border-radius: 999px;
}
.card-note {
  font-family: var(--sans); font-size: 12px; color: var(--ink); font-style: italic; margin-top: 2px; line-height: 1.5;
  white-space: pre-line; background: var(--coral-soft); border-left: 3px solid var(--coral); padding: 7px 10px; border-radius: 4px;
}
.card-footer { margin-top: auto; padding-top: 10px; border-top: 2px dashed var(--ink); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.card-link {
  font-family: var(--sans); font-size: 12.5px; font-weight: 700; color: var(--coral); text-decoration: none;
  display: inline-flex; align-items: center; gap: 5px;
}
.card-link:hover { text-decoration: underline; }
.card-link.disabled { color: #B9B6AC; }
.card-edit-row { display: none; gap: 6px; }
.card-edit-row button {
  font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
  background: var(--panel); border: 1.5px solid var(--ink); border-radius: 20px; padding: 4px 10px;
  cursor: pointer; color: var(--ink); transition: all 0.15s;
}
.card-edit-row button:hover { background: var(--ink); color: var(--bg); }
body.editing .card-edit-row { display: flex; }

.empty { padding: 90px 20px; text-align: center; font-family: var(--serif); font-weight: 900; font-style: italic; font-size: 22px; color: var(--ink-dim); }

/* MODAL */
.overlay {
  display: none; position: fixed; inset: 0; background: rgba(20,21,26,0.55); z-index: 300;
  align-items: center; justify-content: center;
}
.overlay.show { display: flex; }
.modal { width: min(500px, 92vw); max-height: 88vh; overflow-y: auto; background: var(--panel); border: 3px solid var(--ink); border-radius: 16px; padding: 28px; box-shadow: 8px 8px 0 var(--ink); }
.modal h3 { font-family: var(--serif); font-weight: 900; font-size: 22px; margin-bottom: 18px; color: var(--ink); }
.field { margin-bottom: 13px; }
.field label { display:block; font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 5px; }
.field input, .field select, .field textarea {
  width: 100%; padding: 9px 11px; border-radius: 8px; border: 2px solid var(--ink); background: var(--bg);
  font-family: var(--sans); font-size: 13.5px; color: var(--ink); outline: none;
}
.field input:focus, .field select:focus, .field textarea:focus { box-shadow: 3px 3px 0 var(--coral); }
.field textarea { resize: vertical; min-height: 56px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
</style>
</head>
<body>

<header class="header">
  <span class="header-brand">REUTERS™</span>
  <span class="header-title">Sales Prospects</span>
  <nav class="header-nav"><a href="index.html">← Brand Prospector</a></nav>
  <div class="header-meta">
    <button class="edit-toggle" id="edit-toggle" onclick="toggleEdit()">Edit mode: off</button>
  </div>
</header>

<div class="dl-banner" id="dl-banner">
  <span>You've made changes that aren't saved to the live page yet.</span>
  <strong>Download the updated file, then commit + push in GitHub Desktop.</strong>
</div>

<div class="filter-bar">
  <div class="filter-group">
    <span class="filter-group-label">Rep</span>
    <div class="btn-group" id="rep-filters"></div>
  </div>
  <div class="filter-group">
    <span class="filter-group-label">Month</span>
    <div class="btn-group" id="month-filters"></div>
  </div>
  <span class="reset-link" onclick="resetFilters()">Reset</span>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input id="search" type="text" placeholder="Brand or publisher…" oninput="render()">
  </div>
</div>

<div class="toolbar">
  <div class="results-label">Showing <strong id="results-count">0</strong> of <strong id="results-total">0</strong></div>
  <div class="toolbar-actions">
    <button class="btn ghost" id="add-btn" style="display:none" onclick="openModal()">+ Add prospect</button>
    <button class="btn ghost" onclick="downloadUpdated()">Download updated page</button>
  </div>
</div>

<div class="board" id="board"></div>

<div class="overlay" id="modal-overlay" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <h3 id="modal-title">Add prospect</h3>
    <input type="hidden" id="f-id">
    <div class="field"><label>Month</label><input id="f-month" list="month-options" placeholder="e.g. October"></div>
    <datalist id="month-options"></datalist>
    <div class="field"><label>Rep</label>
      <select id="f-rep">
        <option>Dana</option><option>Emma</option><option>Katurah</option><option>Mena</option><option>APAC</option>
      </select>
    </div>
    <div class="field"><label>Brand</label><input id="f-brand" placeholder="e.g. Siemens"></div>
    <div class="field"><label>Publisher</label><input id="f-publisher" placeholder="e.g. Financial Times"></div>
    <div class="field"><label>Country</label><input id="f-country" placeholder="e.g. Germany"></div>
    <div class="field"><label>About the company</label><input id="f-about" placeholder="One line on what they do"></div>
    <div class="field"><label>Link to content</label><input id="f-url" placeholder="https://…"></div>
    <div class="field"><label>Note</label><textarea id="f-note" placeholder="Context, contact name, deal size…"></textarea></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="saveEntry()">Save</button>
    </div>
  </div>
</div>

let filters = { rep: null, month: null };
let editing = false;

function monthOrder(m) {
  const order = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const i = order.indexOf(m);
  return i === -1 ? 999 : i;
}
function uniqueSorted(arr) { return [...new Set(arr)]; }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toggleEdit() {
  editing = !editing;
  document.body.classList.toggle('editing', editing);
  document.getElementById('edit-toggle').classList.toggle('on', editing);
  document.getElementById('edit-toggle').textContent = 'Edit mode: ' + (editing ? 'on' : 'off');
  document.getElementById('add-btn').style.display = editing ? 'inline-block' : 'none';
}

function resetFilters() {
  filters = { rep: null, month: null };
  document.getElementById('search').value = '';
  render();
}

function buildFilterButtons(containerId, values, key) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  values.forEach(v => {
    const b = document.createElement('button');
    b.className = 'filter-btn' + (filters[key] === v ? ' active' : '');
    b.textContent = v;
    b.onclick = () => { filters[key] = filters[key] === v ? null : v; render(); };
    el.appendChild(b);
  });
}

function render() {
  const reps = uniqueSorted(PROSPECTS.map(p => p.rep));
  const months = uniqueSorted(PROSPECTS.map(p => p.month)).sort((a, b) => monthOrder(a) - monthOrder(b));

  buildFilterButtons('rep-filters', reps, 'rep');
  buildFilterButtons('month-filters', months, 'month');

  const dl = document.getElementById('month-options');
  dl.innerHTML = uniqueSorted(PROSPECTS.map(p => p.month)).map(m => `<option value="${m}">`).join('');

  const q = document.getElementById('search').value.trim().toLowerCase();
  let items = PROSPECTS.filter(p =>
    (!filters.rep || p.rep === filters.rep) &&
    (!filters.month || p.month === filters.month) &&
    (!q || p.brand.toLowerCase().includes(q) || (p.publisher || '').toLowerCase().includes(q))
  );

  document.getElementById('results-count').textContent = items.length;
  document.getElementById('results-total').textContent = PROSPECTS.length;

  items.sort((a, b) => a.rep.localeCompare(b.rep) || monthOrder(b.month) - monthOrder(a.month) || a.brand.localeCompare(b.brand));

  const board = document.getElementById('board');
  board.innerHTML = '';
  if (items.length === 0) {
    board.innerHTML = '<div class="empty">Nothing here. Try another filter?</div>';
    return;
  }

  const byRep = new Map();
  for (const p of items) {
    if (!byRep.has(p.rep)) byRep.set(p.rep, []);
    byRep.get(p.rep).push(p);
  }

  let n = 1;
  for (const [rep, repItems] of byRep) {
    const section = document.createElement('div');
    section.className = 'rep-section';

    const heading = document.createElement('div');
    heading.className = 'rep-heading';
    heading.innerHTML = `<span class="rep-heading-name">${escapeHtml(rep)}</span><span class="rep-heading-count">${repItems.length} lead${repItems.length === 1 ? '' : 's'}</span>`;
    section.appendChild(heading);

    const grid = document.createElement('div');
    grid.className = 'card-grid';
    for (const p of repItems) {
      const card = document.createElement('div');
      card.className = 'card';
      const linkHtml = p.url
        ? `<a class="card-link" href="${escapeHtml(p.url)}" target="_blank" rel="noopener">View content →</a>`
        : `<span class="card-link disabled">No link on file</span>`;
      card.innerHTML = `
        <span class="card-lead-n">#${String(n).padStart(3, '0')}</span>
        <div class="card-top">
          <div class="card-brand">${escapeHtml(p.brand)}</div>
          ${p.country ? `<span class="card-country">${escapeHtml(p.country)}</span>` : ''}
        </div>
        ${p.about ? `<div class="card-about">${escapeHtml(p.about)}</div>` : ''}
        <div class="card-meta">
          ${p.publisher ? `<span class="card-pub">${escapeHtml(p.publisher)}</span>` : ''}
          <span class="card-month">${escapeHtml(p.month)}</span>
        </div>
        ${p.note ? `<div class="card-note">${escapeHtml(p.note)}</div>` : ''}
        <div class="card-footer">
          ${linkHtml}
          <div class="card-edit-row">
            <button onclick="openModal(${p.id})">Edit</button>
            <button onclick="deleteEntry(${p.id})">Delete</button>
          </div>
        </div>
      `;
      n++;
      grid.appendChild(card);
    }
    section.appendChild(grid);
    board.appendChild(section);
  }
}

function openModal(id) {
  const modal = document.getElementById('modal-overlay');
  const entry = id ? PROSPECTS.find(p => p.id === id) : null;
  document.getElementById('modal-title').textContent = entry ? 'Edit prospect' : 'Add prospect';
  document.getElementById('f-id').value = entry ? entry.id : '';
  document.getElementById('f-month').value = entry ? entry.month : (uniqueSorted(PROSPECTS.map(p => p.month)).sort((a,b)=>monthOrder(b)-monthOrder(a))[0] || '');
  document.getElementById('f-rep').value = entry ? entry.rep : 'Dana';
  document.getElementById('f-brand').value = entry ? entry.brand : '';
  document.getElementById('f-publisher').value = entry ? entry.publisher : '';
  document.getElementById('f-country').value = entry ? (entry.country || '') : '';
  document.getElementById('f-about').value = entry ? (entry.about || '') : '';
  document.getElementById('f-url').value = entry ? (entry.url || '') : '';
  document.getElementById('f-note').value = entry ? entry.note : '';
  modal.classList.add('show');
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('show'); }

function saveEntry() {
  const idVal = document.getElementById('f-id').value;
  const month = document.getElementById('f-month').value.trim();
  const brand = document.getElementById('f-brand').value.trim();
  if (!month || !brand) { alert('Month and Brand are required.'); return; }
  const entry = {
    id: idVal ? Number(idVal) : Math.max(0, ...PROSPECTS.map(p => p.id)) + 1,
    month,
    rep: document.getElementById('f-rep').value,
    brand,
    publisher: document.getElementById('f-publisher').value.trim(),
    country: document.getElementById('f-country').value.trim(),
    about: document.getElementById('f-about').value.trim(),
    url: document.getElementById('f-url').value.trim(),
    note: document.getElementById('f-note').value.trim(),
  };
  const idx = PROSPECTS.findIndex(p => p.id === entry.id);
  if (idx >= 0) PROSPECTS[idx] = entry; else PROSPECTS.push(entry);
  markDirty();
  closeModal();
  render();
}

function deleteEntry(id) {
  if (!confirm('Delete this prospect?')) return;
  const idx = PROSPECTS.findIndex(p => p.id === id);
  if (idx >= 0) PROSPECTS.splice(idx, 1);
  markDirty();
  render();
}

function markDirty() { document.body.classList.add('dirty'); }

function findJsonEnd(text, start) {
  let inString = false, escape = false, depth = 0;
  for (let i = start; i < text.length; i++) {
    const ch = text[i];
    if (inString) {
      if (escape) escape = false;
      else if (ch === '\\\\') escape = true;
      else if (ch === '"') inString = false;
    } else {
      if (ch === '"') inString = true;
      else if (ch === '{' || ch === '[') depth++;
      else if (ch === '}' || ch === ']') { depth--; if (depth === 0) return i + 1; }
    }
  }
  throw new Error('Could not find end of PROSPECTS block');
}

const ORIGINAL_HTML = '<!DOCTYPE html>\\n' + document.documentElement.outerHTML;

function downloadUpdated() {
  const marker = 'const PROSPECTS = ';
  const start = ORIGINAL_HTML.indexOf(marker) + marker.length;
  const end = findJsonEnd(ORIGINAL_HTML, start);
  const newHtml = ORIGINAL_HTML.slice(0, start) + JSON.stringify(PROSPECTS) + ORIGINAL_HTML.slice(end);
  const blob = new Blob([newHtml], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'prospects.html';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  document.body.classList.remove('dirty');
}

render();
</script>
